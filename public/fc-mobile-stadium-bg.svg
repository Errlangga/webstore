  <radialGradient id="horizon"><stop stop-color="#146bd0" stop-opacity=".78"/><stop offset=".52" stop-color="#0b3d89" stop-opacity=".34"/><stop offset="1" stop-color="#06132f" stop-opacity="0"/></radialGradient>
  <linearGradient id="pitch" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0a4383"/><stop offset="1" stop-color="#03142d"/></linearGradient>
  <linearGradient id="roof" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#267fff" stop-opacity=".05"/><stop offset=".5" stop-color="#5bc8ff" stop-opacity=".5"/><stop offset="1" stop-color="#1545bd" stop-opacity=".08"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
